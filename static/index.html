<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Dormitory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="glass-container">
        <header>
            <div class="title-section">
                <h1>Smart Dormitory</h1>
                <p>Панель управления</p>
            </div>
            <div class="status-indicator online" id="connection-status">
                <span class="dot"></span>
                <span class="text">System Online</span>
            </div>
        </header>

        <section id="devices-grid" class="devices-grid">
            <!-- Devices will be injected here via JS -->
            <div class="loading-card">
                <div class="shimmer"></div>
            </div>
        </section>
    </main>

    <script src="/app.js"></script>
</body>
</html>
